# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true

reactNativeArchitectures=arm64-v8a,x86_64

# Old Arch: react-native-screens 4.20+ expects New Arch / newer codegen. Keep false + pinned nav libs below.
newArchEnabled=false

hermesEnabled=true

# 16 KB page size (Android 15+ / Play)
android.experimental.enablePageAlignNativeLibs=true
android.useV2Signing=true
android.useV3Signing=true
